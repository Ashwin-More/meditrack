<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediTrack — Patient GitHub</title>
<meta name="theme-color" content="#0288D1" id="theme-color-meta" />
<link rel="stylesheet" href="css/style.css" />
<script>
  // Apply the saved theme before first paint, so there's no flash of the wrong theme.
  // Defaults to light mode when the person hasn't chosen yet.
  (function () {
    var t = localStorage.getItem("meditrack.theme") === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
  // Point this at wherever the Spring Boot backend is running.
  // Defaults to http://localhost:8080/api if left unset.
  window.MEDITRACK_API_BASE = "http://localhost:8080/api";
</script>
</head>
<body>

  <!-- Auth screens (login/register) render full-screen, no shell -->
  <div id="auth-theme-slot" class="auth-theme-slot hidden"></div>
  <div id="auth-root"></div>

  <!-- App shell, shown once logged in -->
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">M</span>
        <span class="brand-name"><span class="b-medi">Medi</span><span class="b-track">Track</span></span>
      </div>

      <nav class="nav" id="main-nav">
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/patients" data-route="patients">Patients</a>
        <a href="#/appointments" data-route="appointments">Appointments</a>
        <a href="#/directory" data-route="directory">Doctors &amp; Nurses</a>
        <a href="#/assignments" data-route="assignments" class="role-assign">Manage Assignments</a>
        <a href="#/profile" data-route="profile">My Profile</a>
        <a href="#/admin/users" data-route="admin-users" class="role-admin">Users &amp; Approvals</a>
        <a href="#/admin/audit-logs" data-route="admin-audit" class="role-admin">Audit Logs</a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="user-meta">
            <div class="user-name" id="user-name">—</div>
            <div class="user-role" id="user-role">—</div>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-ghost btn-small">Log out</button>
        <div id="theme-toggle-slot"></div>
      </div>
    </aside>

    <main class="content">
      <div id="toast" class="toast hidden"></div>
      <div class="topbar">
        <div class="topbar-date" id="topbar-date"></div>
        <div class="topbar-right">
          <a class="bell" id="bell" href="#/appointments" title="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="bell-count hidden" id="bell-count">0</span>
          </a>
          <span class="role-pill" id="topbar-role">—</span>
        </div>
      </div>
      <div id="view-root" class="view-root"></div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
