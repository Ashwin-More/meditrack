server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:meditrack}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway owns the schema now (see below), so Hibernate should only
      # verify entities match it, never alter tables itself. Override with
      # JPA_DDL_AUTO=update locally if you'd rather skip Flyway entirely.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
    # true = lazy relations can be read while building a response (Spring's default).
    open-in-view: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h (access token)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}   # 7 days (refresh token)
  # Where the verification / reset links in emails point (the frontend origin).
  frontend-url: ${FRONTEND_URL:http://localhost:5500}
  mail:
    # false = do not send; print the link in this console instead (works with no SMTP account).
    # true  = send real email through the spring.mail.* settings above.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@meditrack.local}
  tokens:
    email-verify-hours: ${EMAIL_VERIFY_HOURS:24}
    password-reset-minutes: ${PASSWORD_RESET_MINUTES:30}
  upload:
    dir: ${UPLOAD_DIR:uploads/reports}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://localhost:8000,http://127.0.0.1:5500,http://127.0.0.1:8000}
  rate-limit:
    login:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX:5}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW:60}

logging:
  level:
    com.meditrack: DEBUG
    org.hibernate.SQL: ${SQL_LOG:INFO}
